<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" type="button" aria-label="Toggle dark and light mode" aria-pressed="false">🌙 Dark Mode</button>
  </header>
  <main>
    <div class="difficulty-control">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div id="timer" aria-live="polite">Time: 0:00</div>
    <div id="sudoku-board" aria-label="Sudoku puzzle"></div>
    <div class="controls">
      <button id="new-game" type="button">New Game</button>
      <button id="hint" type="button">Hint</button>
      <button id="check-solution" type="button">Check Solution</button>
      <span id="hint-count">Hints used: 0</span>
      <span id="message" aria-live="polite"></span>
    </div>
  </main>

  <section class="leaderboard-section" aria-labelledby="leaderboard-heading">
    <h2 id="leaderboard-heading">Top 10 Fastest Times</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Level</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>

  <div id="leaderboard-modal" class="leaderboard-modal hidden" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
    <div class="leaderboard-modal-content">
      <h3 id="leaderboard-title">Save your score</h3>
      <form id="leaderboard-form">
        <label for="player-name">Player name</label>
        <input id="player-name" name="player-name" type="text" maxlength="30" autocomplete="off" required>
        <div class="leaderboard-actions">
          <button type="submit">Submit</button>
          <button type="button" id="leaderboard-cancel" class="secondary-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
